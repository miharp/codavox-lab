# Environment configuration, as the OpenVox control-repo template ships it.
#
# modulepath is relative on purpose. r10k deploys this environment into
# /etc/puppetlabs/code/environments/production on the primary, and codavox unpacks
# the identical tree into a version directory on each compiler — so a relative
# path resolves correctly in both places, while an absolute one would send a
# compiler back to the primary's paths.
modulepath = site-modules:modules:$basemodulepath

# The catalog label. The template's script reads the commit from
# .r10k-deploy.json or .git, which a sealed tree does not carry, and falls back
# to the time; scripts/config_version.sh adds codavox's branch on top, so a
# server compiling from codavox labels catalogs with the short code_id and one
# still compiling from r10k's basedir keeps the commit. Leaving this line out,
# as the lab once did, hides exactly that failure (codavox#97).
config_version = 'scripts/config_version.sh $environmentpath $environment'
